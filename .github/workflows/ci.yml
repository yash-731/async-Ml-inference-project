name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: mypy
        run: mypy app

      - name: Validate docker-compose
        run: docker compose config --quiet

  test:
    name: Tests
    runs-on: ubuntu-latest

    # Real PostgreSQL and Redis rather than fakes: the suite exercises JSONB,
    # a unique constraint, and Alembic migrations, none of which behave the
    # same on SQLite.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forecast
          POSTGRES_PASSWORD: forecast
          POSTGRES_DB: forecast
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forecast"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://forecast:forecast@localhost:5432/forecast_test
      REDIS_URL: redis://localhost:6379/15
      RATE_LIMIT_STORAGE_URI: memory://
      # Integration tests skip when PostgreSQL is unreachable, which is right
      # locally and wrong here. This turns that skip into a failure.
      REQUIRE_DATABASE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Verify migrations apply to an empty database
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://forecast:forecast@localhost:5432/forecast

      - name: Run the full test suite
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ml-inference-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run --rm ml-inference-service:ci \
            python -c "import app.main, app.worker.tasks; print('image imports OK')"
